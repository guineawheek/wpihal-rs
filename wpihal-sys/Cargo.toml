[package]
name = "wpihal-sys"
description = "Autogenerated C bindings for WPIHal"
version = "2027.0.0-alpha-6"
license.workspace = true
authors.workspace = true
repository.workspace = true
edition = "2024"

[features]
default = ["shared", "robot-controller"]
shared = ["wpiutil-sys/shared"]
robot-controller = ["wpiutil-sys/robot-controller"]

[build-dependencies]
wpilib-nativeutils = { path = "../wpilib-nativeutils" }
bindgen.workspace = true
regex.workspace = true
cc.workspace = true
convert_case.workspace = true

[dependencies]
wpiutil-sys = { path = "../wpiutil-sys"}