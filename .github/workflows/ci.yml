name: CI

#on: [workflow_dispatch]
on: [push, pull_request, workflow_dispatch]

jobs:
  build-docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: wpilib/systemcore-cross-ubuntu:2027-24.04
            artifact-name: SystemCore
            target: "aarch64-unknown-linux-gnu"
            flags: "--features robot-controller"
          - container: wpilib/aarch64-cross-ubuntu:bookworm-24.04
            artifact-name: Arm64
            target: "aarch64-unknown-linux-gnu"
            flags: ""
          - container: wpilib/ubuntu-base:24.04
            artifact-name: Linux
            target: "x86_64-unknown-linux-gnu"
            flags: ""
    name: "Build - ${{ matrix.artifact-name }}"
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    steps:
      - name: Install build dependencies
        run: apt-get update && apt-get install -y libclang-dev
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Fetch all history and metadata
        run: |
          git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
      - name: Install rust target toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - name: Attempt to build library
        run: cargo build --target=${{ matrix.target }} -p build-test ${{ matrix.flags }}
      - name: Attempt to run the build-test
        run: cargo run -p build-test ${{ matrix.flags }} && cargo run -p build-test ${{ matrix.flags }} --release

  build-host:
    env: 
      MACOSX_DEPLOYMENT_TARGET: 13.3
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact-name: WinX64
            architecture: x64
            flags: ""
          - os: windows-2022
            artifact-name: WinArm64
            architecture: aarch64
            flags: ""
          - os: macos-15
            artifact-name: macOS
            architecture: aarch64
            flags: ""
    name: "Build - ${{ matrix.artifact-name }}"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Attempt to build/run library
        run: cargo run -p build-test ${{ matrix.flags }} && cargo run -p build-test ${{ matrix.flags }} --release
